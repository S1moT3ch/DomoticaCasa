<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelly HUB - Official API Multi-Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');
        body { background-color: #030712; color: #e5e7eb; font-family: 'Rajdhani', sans-serif; }
        .neon-border { border: 2px solid #22d3ee; box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); transition: 0.3s; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; transition: 0.3s; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

    <header class="w-full max-w-6xl bg-gray-900/50 border border-gray-700 rounded-2xl p-4 mb-6 flex justify-between items-center shadow-xl">
        <h1 class="text-xl md:text-2xl title-font font-bold italic tracking-tighter">
            SHELLY <span class="text-cyan-400 font-bold">HUB</span>
        </h1>
        <div id="status-badge" class="flex items-center gap-2 bg-black/40 px-3 py-1 rounded-full border border-red-500/50 text-red-500 text-[10px] uppercase tracking-widest">
            <span class="relative flex h-2 w-2">
                <span id="ping-anim" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span id="ping-solid" class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
            </span>
            <span id="status-text">Broker Offline</span>
        </div>
    </header>

    <main class="w-full max-w-6xl">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- GRID 4 SHELLY 1 -->
            <div id="controls-container" class="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Generato via JS -->
            </div>

            <!-- COLONNA ALLARME I/O (GEN 2/3) -->
            <div class="lg:col-span-1">
                <div class="neon-border rounded-3xl bg-gray-900/80 p-6 flex flex-col h-full border-purple-500/30 shadow-[0_0_20px_rgba(168,85,247,0.1)]">
                    <div class="flex items-center gap-4 mb-6 border-b border-purple-500/20 pb-4">
                        <div class="p-3 bg-purple-500/20 rounded-xl border border-purple-500/50">
                            <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                        </div>
                        <h2 class="text-xl font-bold uppercase tracking-wider text-purple-100 italic">Allarme I/O</h2>
                    </div>

                    <div class="space-y-3 mb-6">
                        <div class="bg-black/40 p-3 rounded-xl border border-gray-800 flex justify-between items-center">
                            <span class="uppercase text-[10px] font-bold tracking-widest text-gray-500">Digital IN 0</span>
                            <div class="flex items-center gap-2">
                                <span id="io-in0-text" class="text-[10px] font-bold text-red-500 uppercase">OFF</span>
                                <span id="io-in0-dot" class="status-dot bg-red-500 shadow-[0_0_8px_#ef4444]"></span>
                            </div>
                        </div>
                        <div class="bg-black/40 p-3 rounded-xl border border-gray-800 flex justify-between items-center">
                            <span class="uppercase text-[10px] font-bold tracking-widest text-gray-500">Digital IN 1</span>
                            <div class="flex items-center gap-2">
                                <span id="io-in1-text" class="text-[10px] font-bold text-red-500 uppercase">OFF</span>
                                <span id="io-in1-dot" class="status-dot bg-red-500 shadow-[0_0_8px_#ef4444]"></span>
                            </div>
                        </div>
                    </div>

                    <div class="text-center p-4 bg-purple-500/5 rounded-2xl border border-purple-500/20 mb-6">
                        <span class="block uppercase text-[10px] tracking-[0.2em] text-purple-400 mb-1 font-bold">Analog Voltage</span>
                        <div class="text-4xl font-bold title-font text-white">
                            <span id="io-volts">0.00</span><span class="text-sm text-purple-400 ml-1">V</span>
                        </div>
                    </div>

                    <button onclick="sendCmd(IO_ID, !isIoRelayOn)" id="io-relay-btn" class="mt-auto py-3 rounded-xl bg-purple-900/20 border border-purple-500/30 text-purple-400 font-bold hover:bg-purple-500 hover:text-black transition-all text-xs tracking-widest uppercase active:scale-95">
                        Relay 0: OFF
                    </button>
                </div>
            </div>
        </div>

        <!-- MONITOR LOG -->
        <div class="w-full bg-black/90 border border-gray-800 rounded-xl p-4 font-mono shadow-2xl mt-8">
            <div class="flex justify-between items-center mb-2 border-b border-gray-800 pb-2">
                <span class="text-gray-500 uppercase text-[10px] tracking-widest font-bold">Monitor Log Integrale (API Sincronizzata)</span>
                <button onclick="clearLog()" class="text-cyan-700 hover:text-cyan-400 text-[10px] uppercase">Pulisci</button>
            </div>
            <div id="log-console" class="h-40 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-[11px]"></div>
        </div>
    </main>

    <script>
        // --- CONFIGURAZIONE ---
        const DEVICES = [
            { id: "Ricircolo.shelly", name: "Ricircolo" },
            { id: "Allarme.shelly", name: "Allarme" },
            { id: "TapoHome.shelly", name: "Tapo C210 Casa" },
            { id: "LuceCucina.shelly", name: "Luce Cucina" }
        ];

        const IO_ID = "AllarmeIO.shelly";
        let isIoRelayOn = false;

        const BROKER_HOST = window.location.hostname; 
        const BROKER_PORT = 9001;
        const CLIENT_ID = "web_ui_final_" + Math.random().toString(16).substr(2, 5);

        let client = new Paho.MQTT.Client(BROKER_HOST, BROKER_PORT, CLIENT_ID);

        // --- GENERAZIONE UI ---
        const container = document.getElementById('controls-container');
        DEVICES.forEach(dev => {
            container.innerHTML += `
                <div class="neon-border rounded-3xl bg-gray-900/80 p-5">
                    <div class="flex items-center gap-4 mb-6">
                        <div id="icon-bg-${dev.id}" class="p-3 bg-gray-800 rounded-xl border border-gray-700 transition-all">
                            <svg class="w-6 h-6 text-gray-500" id="icon-${dev.id}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold uppercase tracking-wider text-cyan-100">${dev.name}</h2>
                            <p class="text-[10px] text-gray-400 uppercase font-semibold">Stato: <span id="status-val-${dev.id}" class="text-yellow-500 italic">Sincronizzazione...</span></p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="sendCmd('${dev.id}', true)" class="py-3 rounded-xl bg-cyan-900/10 border border-cyan-500/20 text-cyan-600 font-bold hover:bg-cyan-500 hover:text-black transition-all active:scale-95 text-xs tracking-widest shadow-inner">ON</button>
                        <button onclick="sendCmd('${dev.id}', false)" class="py-3 rounded-xl bg-red-900/10 border border-red-500/20 text-red-600 font-bold hover:bg-red-500 hover:text-black transition-all active:scale-95 text-xs tracking-widest shadow-inner">OFF</button>
                    </div>
                </div>
            `;
        });

        function addLog(msg, type = 'in') {
            const log = document.getElementById('log-console');
            log.innerHTML += `<p class="${type === 'in' ? 'text-green-400' : 'text-cyan-400'}"><span class="text-gray-600 font-bold">${new Date().toLocaleTimeString()}</span> ${msg}</p>`;
            log.scrollTop = log.scrollHeight;
        }

        // --- PARSER MQTT BASATO SU API SHELLY GEN2/3 ---
        client.onMessageArrived = (msg) => {
            const topic = msg.destinationName;
            const payload = msg.payloadString;
            const deviceId = topic.split('/')[0];
            
            try {
                const data = JSON.parse(payload);
                
                // Mappatura specifica AllarmeIO (Shelly Plus I4 / Gen2)
                if (deviceId === IO_ID) {
                    // Notifiche NotifyStatus (Push in tempo reale)
                    if (data.method === "NotifyStatus" && data.params) {
                        const p = data.params;
                        if (p['input:0']) updateInputUI(0, p['input:0'].state);
                        if (p['input:1']) updateInputUI(1, p['input:1'].state);
                        if (p['voltmeter:100']) document.getElementById('io-volts').innerText = p['voltmeter:100'].voltage.toFixed(2);
                        if (p['switch:0']) updateIoRelayUI(p['switch:0'].output);
                    }
                    // Risposte GetStatus (Sincronizzazione iniziale)
                    if (data.result) {
                        const r = data.result;
                        if (r['input:0']) updateInputUI(0, r['input:0'].state);
                        if (r['input:1']) updateInputUI(1, r['input:1'].state);
                        if (r['voltmeter:100']) document.getElementById('io-volts').innerText = r['voltmeter:100'].voltage.toFixed(2);
                        if (r['switch:0']) updateIoRelayUI(r['switch:0'].output);
                    }
                    // Messaggi diretti dal topic status (Backup)
                    if (topic.includes('/status/input:')) {
                        const idx = topic.split(':').pop();
                        updateInputUI(idx, data.state);
                    }
                    if (topic.includes('/status/voltmeter:100')) {
                        document.getElementById('io-volts').innerText = data.voltage.toFixed(2);
                    }
                } 
                // Parser Shelly 1 standard
                else {
                    let state = null;
                    if (data.result && data.result.output !== undefined) state = data.result.output;
                    else if (data.params && data.params['switch:0']) state = data.params['switch:0'].output;
                    else if (data.output !== undefined) state = data.output;
                    
                    if (state !== null) updateDeviceUI(deviceId, state);
                }
                addLog(`${topic}`);
            } catch(e) {}
        };

        function updateInputUI(idx, state) {
            const text = document.getElementById(`io-in${idx}-text`);
            const dot = document.getElementById(`io-in${idx}-dot`);
            if(!text || !dot) return;
            text.innerText = state ? "ON" : "OFF";
            text.className = state ? "text-green-400 text-[10px] font-bold" : "text-red-500 text-[10px] font-bold";
            dot.className = state ? "status-dot bg-green-500 shadow-[0_0_8px_#10b981]" : "status-dot bg-red-500 shadow-[0_0_8px_#ef4444]";
        }

        function updateIoRelayUI(isOn) {
            isIoRelayOn = isOn;
            const btn = document.getElementById('io-relay-btn');
            btn.innerText = isOn ? "Relay 0: ON" : "Relay 0: OFF";
            btn.className = isOn ? "mt-auto py-3 rounded-xl bg-green-500/20 border border-green-500/50 text-green-400 font-bold transition-all text-xs tracking-widest uppercase" : "mt-auto py-3 rounded-xl bg-purple-900/20 border border-purple-500/30 text-purple-400 font-bold transition-all text-xs tracking-widest uppercase";
        }

        function sendCmd(id, state) {
            const payload = JSON.stringify({id: 1, src: `${id}/rpc`, method: "Switch.Set", params: { id: 0, on: state }});
            const message = new Paho.MQTT.Message(payload);
            message.destinationName = `${id}/rpc`;
            client.send(message);
            addLog(`INVIO -> ${id} (${state ? 'ON' : 'OFF'})`, 'out');
        }

        function onConnect() {
            updateConnUI(true);
            addLog("Sistema Online. API Sync in corso...");
            
            // Shelly 1 Sinc
            DEVICES.forEach(dev => {
                client.subscribe(`${dev.id}/#`);
                const cmd = JSON.stringify({id: 1, src: `${dev.id}/rpc`, method: "Switch.GetStatus", params: { id: 0 }});
                const message = new Paho.MQTT.Message(cmd);
                message.destinationName = `${dev.id}/rpc`;
                client.send(message);
            });

            // AllarmeIO Sinc (Specifica Gen2 API)
            client.subscribe(`${IO_ID}/#`);
            const syncCmd = new Paho.MQTT.Message(JSON.stringify({id:1, src:`${IO_ID}/rpc`, method:"Shelly.GetStatus"}));
            syncCmd.destinationName = `${IO_ID}/rpc`;
            client.send(syncCmd);
        }

        function updateDeviceUI(id, isOn) {
            const val = document.getElementById(`status-val-${id}`);
            if(!val) return;
            val.innerText = isOn ? 'ACCESO' : 'SPENTO';
            val.className = isOn ? 'text-cyan-400 font-bold' : 'text-red-500 font-bold';
            document.getElementById(`icon-bg-${id}`).className = `p-3 ${isOn ? 'bg-cyan-500/20 border-cyan-500/50 shadow-[0_0_15px_rgba(34,211,238,0.2)]' : 'bg-gray-800 border-gray-700'} rounded-xl border transition-all`;
            document.getElementById(`icon-${id}`).className = `w-6 h-6 ${isOn ? 'text-cyan-400' : 'text-gray-500'}`;
        }

        function updateConnUI(connected) {
            const badge = document.getElementById('status-badge');
            document.getElementById('status-text').innerText = connected ? "Broker Online" : "Broker Offline";
            badge.className = `flex items-center gap-2 bg-black/40 px-3 py-1 rounded-full border ${connected ? 'border-green-500/50 text-green-500' : 'border-red-500/50 text-red-500'} text-[10px] uppercase tracking-widest`;
            document.getElementById('ping-anim').className = `animate-ping absolute inline-flex h-full w-full rounded-full ${connected ? 'bg-green-400' : 'bg-red-400'} opacity-75`;
            document.getElementById('ping-solid').className = `relative inline-flex rounded-full h-2 w-2 ${connected ? 'bg-green-500' : 'bg-red-500'}`;
        }

        function clearLog() { document.getElementById('log-console').innerHTML = ''; }
        client.onConnectionLost = (resp) => { updateConnUI(false); setTimeout(() => client.connect({ onSuccess: onConnect, useSSL: false }), 5000); };
        client.connect({ onSuccess: onConnect, useSSL: false });
    </script>
</body>
</html>
